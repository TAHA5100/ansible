# هذا سير عمل أساسي لمساعدتك على البدء في الإجراءات

اسم:           اختبار الصدى ونشر مشروعك.

# يتحكم في وقت تشغيل سير العمل
على:
  # يتم تشغيل سير العمل عند أحداث طلب الدفع أو السحب ولكن فقط للفرع "الرئيسي"
  يدفع:
    الفروع: [ "الرئيسي" ]
  طلب سحب:
    الفروع: [ "الرئيسي" ]

  # يسمح لك بتشغيل سير العمل هذا يدويًا من علامة التبويب "الإجراءات"
  سير العمل_الإرسال:

# يتكون تشغيل سير العمل من مهمة واحدة أو أكثر يمكن تشغيلها بشكل تسلسلي أو بالتوازي
وظائف:
  # يحتوي سير العمل هذا على مهمة واحدة تسمى "البناء"
  بناء:
    # نوع المشغل الذي سيتم تشغيل المهمة عليه
    يعمل على: أوبونتو-الأحدث

    # تمثل الخطوات سلسلة من المهام التي سيتم تنفيذها كجزء من المهمة
    خطوات:
      # تَقق من المِسَتُدٹ الخاص ب٨ك سمن $GITHUB_WORKSPACE، تَتَتَكَن وَيْتَك ممن الوَصْل إِله
      - الاستخدامات: الإجراءات/checkout@v4

      # يتم تشغيل أمر واحد باستخدام غلاف التشغيل
      - اسم: تشغيل البرنامج النصي المكون من سطر واحد
        الركض: صدى مرحبا بالعالم!

      # تشغيل مجموعة من الأوامر باستخدام غلاف التشغيل
      - اسم: تشغيل البرنامج النصي متعدد الأسطر
        الركض: |
          صدى إضافة إجراءات أخرى للبناء،
          اختبار الصدى ونشر مشروعك.
